<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Account | Sif's Gold</title>
  <link rel="stylesheet" href="/billing.css" />
</head>
<body>
  <main class="container">
    <header class="topbar"><a class="brand" href="/">Sif's Gold</a><nav class="nav"><a href="/pricing">Pricing</a><a href="/account">Account</a></nav></header>
    <section class="card stack">
      <h1>Manage Subscription</h1>
      <p class="muted">View your current plan, billing history, receipts, payment methods, and cancellation options in Stripe Customer Portal.</p>
      <button id="portalBtn" class="btn">Manage Billing →</button>
      <p class="muted">Stripe handles all billing management securely.</p>
    </section>
  </main>
  <script>
    document.getElementById('portalBtn').onclick = async () => {
      try {
        const res = await fetch('/api/create-billing-portal-session', { method: 'POST' });
        const data = await res.json();
        if (!res.ok || !data.url) throw new Error(data.error || 'Unable to open portal');
        window.location.href = data.url;
      } catch (e) {
        alert(e.message || 'Unable to open billing portal.');
      }
    };
  </script>
</body>
</html>
